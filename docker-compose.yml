services:
  db:
    image: postgres:15
    volumes:
      - eng_cards_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    env_file:
      - ./.env
  web:
    build: .
    volumes:
      - ./app:/app
      - ./.env:/app/.env
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      - db
volumes:
  eng_cards_pgdata: